name: Web app

on:
  push:
    paths-ignore: ['server/**', '**/*.md']
  pull_request:
    paths-ignore: ['server/**', '**/*.md']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - name: Demo build (in-browser data)
        run: npm run build
      - name: Live build (talks to the API)
        run: npm run build
        env:
          VITE_API_URL: https://erp.example.org
