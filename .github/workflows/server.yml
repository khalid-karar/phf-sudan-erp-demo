name: API server

on:
  push:
    paths: ['server/**', 'src/data/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'src/data/**', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phf
          POSTGRES_PASSWORD: phf
          POSTGRES_DB: phf_erp_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U phf" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://phf:phf@localhost:5432/phf_erp_test
